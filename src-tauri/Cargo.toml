[package]
name = "purewall"
version = "0.1.0"
edition = "2021"
authors = ["PureWall contributors"]
description = "A local-first Windows wallpaper manager"
license = "MIT"
repository = "https://github.com/WiseZenn/PureWall"
homepage = "https://github.com/WiseZenn/PureWall"
readme = "../README.md"
publish = false

[features]
default = []
performance-harness = []
watcher-lifecycle = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "image-ico", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2.4.2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
notify = "7"
image = "0.25"
dirs = "6"
fastrand = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
url = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.60", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Storage_FileSystem",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }
trash = "5"

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
