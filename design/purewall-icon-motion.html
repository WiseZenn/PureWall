<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PureWall Icon Motion</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1218;
      --panel: #141c24;
      --text: #eef8f5;
      --muted: #9fb4af;
      --line: #2b3942;
      --accent: #238be6;
      --duration: 920ms;
      --speed: .65;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 32px;
      font-family: "Geist", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(circle at 50% 24%, #172630 0, var(--bg) 42%);
      color: var(--text);
    }

    main { display: grid; gap: 24px; justify-items: center; }
    #logo-root { width: min(70vw, 220px); aspect-ratio: 1; display: grid; place-items: center; }
    svg { width: 100%; height: auto; overflow: visible; }

    .controls,
    .principles,
    .atoms { display: flex; gap: 10px; align-items: center; justify-content: center; flex-wrap: wrap; }

    button,
    label,
    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      background: color-mix(in srgb, var(--panel) 86%, transparent);
      color: var(--text);
      padding: 8px 12px;
      font: inherit;
      font-size: 13px;
    }

    button { cursor: pointer; }
    button:hover { border-color: var(--accent); }
    input { accent-color: var(--accent); }
    .pill { color: var(--muted); }

    .atom { width: 64px; height: 64px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 16px; background: #111922; }
    .atom svg { width: 42px; }

    .motion #base-plate,
    .motion #base-border,
    .motion #back-card,
    .motion #mid-card,
    .motion #wallpaper-card,
    .motion #next-chevron {
      transform-box: fill-box;
      transform-origin: center;
      animation-duration: calc(var(--duration) / var(--speed));
      animation-fill-mode: both;
    }

    .motion #base-plate,
    .motion #base-border {
      animation-name: base-arrive;
      animation-timing-function: cubic-bezier(0, 0, 0.2, 1);
    }

    .motion #back-card { animation-name: back-card-arrive; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .motion #mid-card { animation-name: mid-card-arrive; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .motion #wallpaper-card { animation-name: wallpaper-arrive; animation-timing-function: cubic-bezier(0.16, 1, 0.3, 1); }
    .motion #next-chevron { animation-name: chevron-arrive; animation-timing-function: cubic-bezier(0.4, 0, 0.2, 1); }

    @keyframes base-arrive {
      0% { opacity: 0; transform: scale(.93); }
      18% { opacity: 1; transform: scale(.985); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes back-card-arrive {
      0%, 10% { opacity: 0; transform: translateY(16px) scale(.96); }
      48%, 100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes mid-card-arrive {
      0%, 18% { opacity: 0; transform: translateY(14px) translateX(-6px) scale(.96); }
      58%, 100% { opacity: 1; transform: translateY(0) translateX(0) scale(1); }
    }

    @keyframes wallpaper-arrive {
      0%, 28% { opacity: 0; transform: translateX(-20px) scale(.96); }
      72% { opacity: 1; transform: translateX(1px) scale(1); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }

    @keyframes chevron-arrive {
      0%, 58% { opacity: 0; transform: translateX(-14px); }
      82% { opacity: 1; transform: translateX(2px); }
      100% { opacity: 1; transform: translateX(0); }
    }

    .atom-pulse #next-chevron { animation: pulse 1500ms cubic-bezier(0.4, 0, 0.2, 1) infinite; transform-box: fill-box; transform-origin: center; }
    .atom-lift svg { transition: transform 180ms cubic-bezier(0, 0, 0.2, 1); }
    .atom-lift:hover svg { transform: translateY(-3px); }
    .atom-stack #mid-card { animation: stack 1300ms cubic-bezier(0.4, 0, 0.2, 1) infinite alternate; transform-box: fill-box; transform-origin: center; }

    @keyframes pulse { 50% { opacity: .62; transform: translateX(2px); } }
    @keyframes stack { from { transform: translateX(-5px); } to { transform: translateX(0); } }

    @media (prefers-reduced-motion: reduce) {
      .motion *, .atom * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main>
    <div id="logo-root" aria-label="PureWall animated icon"></div>
    <div class="controls">
      <button type="button" id="replay">Replay</button>
      <button type="button" id="slow">Slow</button>
      <label>Speed <input id="speed" type="range" min="0.25" max="1.5" step="0.05" value="0.65" /></label>
    </div>
    <div class="principles">
      <span class="pill">Staging</span>
      <span class="pill">Slow In/Out</span>
      <span class="pill">Timing</span>
      <span class="pill">Follow Through</span>
      <span class="pill">Appeal</span>
    </div>
    <div class="atoms" aria-label="Atomic motions">
      <div class="atom atom-pulse" title="Next pulse"></div>
      <div class="atom atom-lift" title="Hover lift"></div>
      <div class="atom atom-stack" title="Stack shift"></div>
    </div>
  </main>

  <template id="icon-template">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="PureWall icon">
      <defs>
        <linearGradient id="base" x1="38" y1="18" x2="218" y2="238" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fbfdff"/><stop offset="1" stop-color="#edf6ff"/></linearGradient>
        <linearGradient id="photo" x1="76" y1="70" x2="176" y2="190" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#6bb8f1"/><stop offset=".56" stop-color="#b8dcf8"/><stop offset="1" stop-color="#f4faff"/></linearGradient>
        <linearGradient id="accent" x1="190" y1="100" x2="190" y2="170" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#238be6"/><stop offset="1" stop-color="#096fc8"/></linearGradient>
        <clipPath id="wallpaper-clip"><rect x="70" y="66" width="124" height="124" rx="28"/></clipPath>
      </defs>
      <g id="logo">
        <rect id="base-plate" x="8" y="8" width="240" height="240" rx="54" fill="url(#base)"/>
        <rect id="base-border" x="10" y="10" width="236" height="236" rx="52" fill="none" stroke="#d3e5f7" stroke-width="3"/>
        <rect id="back-card" x="43" y="48" width="128" height="124" rx="28" fill="#e3f1ff"/>
        <rect id="mid-card" x="56" y="57" width="128" height="124" rx="28" fill="#fbfdff" stroke="#d6e6f7" stroke-width="3"/>
        <g id="wallpaper-card">
          <rect x="70" y="66" width="124" height="124" rx="28" fill="url(#photo)"/>
          <g clip-path="url(#wallpaper-clip)">
            <circle id="wallpaper-sun" cx="101" cy="96" r="11" fill="#238be6"/>
            <path id="wallpaper-snow" d="M70 144 L103 116 L132 143 L154 124 L194 158 L194 190 L70 190 Z" fill="#ffffff" opacity=".94"/>
            <path id="wallpaper-ridge" d="M70 160 L110 134 L140 158 L160 144 L194 166 L194 190 L70 190 Z" fill="#4a6f91" opacity=".62"/>
          </g>
          <rect x="70" y="66" width="124" height="124" rx="28" fill="none" stroke="#4a6f91" stroke-width="6"/>
        </g>
        <path id="next-chevron" d="M188 111 L207 128 L188 145" fill="none" stroke="url(#accent)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </svg>
  </template>

  <script>
    const params = new URLSearchParams(location.search);
    const root = document.querySelector('#logo-root');
    const template = document.querySelector('#icon-template');
    const speed = document.querySelector('#speed');
    const slow = document.querySelector('#slow');

    function cloneIcon() { return template.content.firstElementChild.cloneNode(true); }
    function render(target, className = '') {
      target.replaceChildren();
      const svg = cloneIcon();
      if (className) svg.classList.add(className);
      target.append(svg);
      return svg;
    }

    function replay() {
      const svg = render(root, 'motion');
      svg.style.setProperty('--speed', speed.value);
      window.__p2mReady = true;
    }

    document.querySelector('#replay').addEventListener('click', replay);
    speed.addEventListener('input', () => root.querySelector('svg')?.style.setProperty('--speed', speed.value));
    slow.addEventListener('click', () => { speed.value = speed.value === '0.35' ? '0.65' : '0.35'; replay(); });
    document.querySelectorAll('.atom').forEach((atom) => render(atom, atom.classList.contains('atom-pulse') ? 'atom-pulse' : atom.classList.contains('atom-stack') ? 'atom-stack' : ''));

    if (params.has('static') || matchMedia('(prefers-reduced-motion: reduce)').matches) {
      render(root);
      window.__p2mReady = true;
    } else {
      replay();
      if (params.has('t')) {
        const ms = Number(params.get('t') || '0');
        const svg = root.querySelector('svg');
        svg.getAnimations({ subtree: true }).forEach((animation) => {
          animation.pause();
          animation.currentTime = Math.max(0, ms);
        });
      }
    }
  </script>
</body>
</html>
