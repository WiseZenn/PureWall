name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # Actions pinned to reviewed commit SHAs (update deliberately + document).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - run: npm ci

      # Fast, cheap gates first so dependency regressions fail early.
      - run: npm audit --omit=dev

      - run: npm run test:release-contract

      - run: npm run verify:release

      - run: npx vue-tsc --noEmit

      - run: npm run test:unit

      - run: npm run build

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo check
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

      - name: Verify performance harness contract (small synthetic fixture only)
        run: npm run test:performance-harness

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - run: cargo build --release
        working-directory: src-tauri

      - run: npm run tauri build
