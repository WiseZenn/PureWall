name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      # Actions pinned to reviewed commit SHAs (update deliberately + document).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - run: npm ci

      # Fast, cheap gates first so dependency regressions fail early.
      - run: npm audit --omit=dev

      - run: npm run test:release-contract

      - run: npm run verify:release

      - run: npx vue-tsc --noEmit

      - run: npm run test:unit

      - run: npm run build

      - run: cargo fmt --check
        working-directory: src-tauri

      - run: cargo check
        working-directory: src-tauri

      - run: cargo test
        working-directory: src-tauri

      - name: Verify performance harness contract (small synthetic fixture only)
        run: npm run test:performance-harness

      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri

      - run: cargo build --release
        working-directory: src-tauri

      # Ordinary CI proves unsigned packaging without release signing secrets.
      # Tag releases use the generated signed configuration in release.yml.
      - run: npm run tauri build -- --config '{"bundle":{"createUpdaterArtifacts":false}}'
