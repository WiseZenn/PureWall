name: watcher-lifecycle

# Real Windows notify and junction coverage. This workflow is manual-only and runs
# against a unique owned root on a disposable GitHub-hosted runner. It never starts
# Tauri, accesses PureWall AppData, or changes wallpaper/registry/system settings.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-watcher-lifecycle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable

      - name: Prepare disposable owned watcher root
        shell: pwsh
        run: |
          if ($env:GITHUB_ACTIONS -ne 'true' -or $env:RUNNER_ENVIRONMENT -ne 'github-hosted') {
            throw 'Native watcher lifecycle coverage requires a GitHub-hosted disposable runner.'
          }
          if ([string]::IsNullOrWhiteSpace($env:RUNNER_TEMP)) {
            throw 'RUNNER_TEMP is required.'
          }
          $root = Join-Path $env:RUNNER_TEMP ('purewall-watcher-lifecycle-' + [guid]::NewGuid().ToString('N'))
          [void](New-Item -ItemType Directory -Path $root -ErrorAction Stop)
          $marker = Join-Path $root '.purewall-watcher-lifecycle-owner'
          $utf8 = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText($marker, "purewall-watcher-lifecycle-v1`n", $utf8)
          "PUREWALL_WATCHER_LIFECYCLE_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run ignored native watcher lifecycle tests serially
        working-directory: src-tauri
        run: >
          cargo test --features watcher-lifecycle watcher_lifecycle_tests:: -- --ignored --nocapture --test-threads=1
