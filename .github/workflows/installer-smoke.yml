name: installer-smoke

# Disposable-runner installer lifecycle coverage. Run manually against a signed draft or
# published release tag: downloads the MSI and SHA256SUMS.txt, verifies the checksum and
# GitHub attestation, then runs clean-install / optional upgrade / uninstall verification
# with -DisposableRunner. This workflow only reads release assets and NEVER publishes,
# edits, or deletes a release.
on:
  workflow_dispatch:
    inputs:
      currentTag:
        description: "Current release tag whose signed MSI and checksums should be smoke tested."
        required: true
        type: string
      previousTag:
        description: "Optional previous release tag to exercise the clean-install + upgrade path."
        required: false
        type: string

permissions:
  contents: read
  attestations: read

jobs:
  lifecycle-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Validate release tags
        shell: pwsh
        env:
          INPUT_CURRENT_TAG: ${{ inputs.currentTag }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previousTag }}
        run: |
          $current = $env:INPUT_CURRENT_TAG
          if ($current -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "currentTag must be a strict v<major>.<minor>.<patch> tag, got: $current"
          }
          if ($env:INPUT_PREVIOUS_TAG) {
            $previous = $env:INPUT_PREVIOUS_TAG
            if ($previous -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
              throw "previousTag must be a strict v<major>.<minor>.<patch> tag, got: $previous"
            }
          }
          Write-Host "Tags validated: current=$current previous=$($env:INPUT_PREVIOUS_TAG)"

      - name: Download current MSI and checksums
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CURRENT_TAG: ${{ inputs.currentTag }}
        run: |
          $currentDir = Join-Path $env:RUNNER_TEMP 'smoke-current'
          New-Item -ItemType Directory -Path $currentDir -Force | Out-Null
          gh release download "$env:INPUT_CURRENT_TAG" --repo WiseZenn/PureWall --dir $currentDir --pattern "*.msi" --pattern "SHA256SUMS.txt"
          $msiCount = @(Get-ChildItem -Path $currentDir -Filter *.msi).Count
          if ($msiCount -ne 1) { throw "Expected exactly one MSI from tag $($env:INPUT_CURRENT_TAG), found $msiCount" }

      - name: Verify SHA256SUMS.txt and GitHub attestation for current MSI
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_CURRENT_TAG: ${{ inputs.currentTag }}
        run: |
          $currentDir = Join-Path $env:RUNNER_TEMP 'smoke-current'
          $sumsPath = Join-Path $currentDir 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sumsPath)) { throw "SHA256SUMS.txt not found for tag $($env:INPUT_CURRENT_TAG)" }
          $msi = Get-ChildItem -Path $currentDir -Filter *.msi | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = Get-Content -LiteralPath $sumsPath | Where-Object { $_ -match [regex]::Escape($msi.Name) }
          if (-not $expectedLine) { throw "No SHA256SUMS.txt line found for $($msi.Name)" }
          if ($expectedLine -notmatch $hash) { throw "SHA256 checksum mismatch for $($msi.Name)" }
          Write-Host "SHA256 verified: $($msi.Name)"
          gh attestation verify $msi.FullName --repo WiseZenn/PureWall

      - name: Download previous MSI and checksums when supplied
        if: inputs.previousTag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previousTag }}
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP 'smoke-previous'
          New-Item -ItemType Directory -Path $previousDir -Force | Out-Null
          gh release download "$env:INPUT_PREVIOUS_TAG" --repo WiseZenn/PureWall --dir $previousDir --pattern "*.msi" --pattern "SHA256SUMS.txt"
          $msiCount = @(Get-ChildItem -Path $previousDir -Filter *.msi).Count
          if ($msiCount -ne 1) { throw "Expected exactly one MSI from tag $($env:INPUT_PREVIOUS_TAG), found $msiCount" }

      - name: Verify SHA256SUMS.txt and GitHub attestation for previous MSI
        if: inputs.previousTag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $previousDir = Join-Path $env:RUNNER_TEMP 'smoke-previous'
          $sumsPath = Join-Path $previousDir 'SHA256SUMS.txt'
          if (-not (Test-Path -LiteralPath $sumsPath)) { throw "SHA256SUMS.txt not found for previous tag" }
          $msi = Get-ChildItem -Path $previousDir -Filter *.msi | Select-Object -First 1
          $hash = (Get-FileHash -LiteralPath $msi.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          $expectedLine = Get-Content -LiteralPath $sumsPath | Where-Object { $_ -match [regex]::Escape($msi.Name) }
          if (-not $expectedLine) { throw "No SHA256SUMS.txt line found for $($msi.Name)" }
          if ($expectedLine -notmatch $hash) { throw "SHA256 checksum mismatch for $($msi.Name)" }
          Write-Host "SHA256 verified (previous): $($msi.Name)"
          gh attestation verify $msi.FullName --repo WiseZenn/PureWall

      - name: Run installer lifecycle smoke on the disposable runner
        shell: pwsh
        env:
          INPUT_CURRENT_TAG: ${{ inputs.currentTag }}
          INPUT_PREVIOUS_TAG: ${{ inputs.previousTag }}
        run: |
          $currentDir = Join-Path $env:RUNNER_TEMP 'smoke-current'
          $currentMsi = (Get-ChildItem -Path $currentDir -Filter *.msi | Select-Object -First 1).FullName
          $scriptArgs = @('-CurrentMsi', $currentMsi, '-DisposableRunner')
          if ($env:INPUT_PREVIOUS_TAG -ne '') {
            $previousDir = Join-Path $env:RUNNER_TEMP 'smoke-previous'
            $previousMsi = (Get-ChildItem -Path $previousDir -Filter *.msi | Select-Object -First 1).FullName
            $scriptArgs += @('-PreviousMsi', $previousMsi)
          }
          powershell -ExecutionPolicy Bypass -File scripts/verify-install-lifecycle.ps1 @scriptArgs
